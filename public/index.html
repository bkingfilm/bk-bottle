  "玳瑁", "沉锚", "海图", "月光", "汽笛", "北斗", "远帆", "夜航", "冰山", "季风"
];
function nickname(dev) {
  var h = 5381;
  for (var i = 0; i < dev.length; i++) h = ((h * 33) ^ dev.charCodeAt(i)) >>> 0;
  // 位数必须和服务端一致,否则自己看到的代号和别人看到的对不上
  return SEA_WORDS[h % SEA_WORDS.length] + " " + ((h >>> 5) % 900 + 100);
}

var ID_PATTERNS = [
  /[?&]v=([A-Za-z0-9_-]{11})/,
  /youtu\.be\/([A-Za-z0-9_-]{11})/,
  /shorts\/([A-Za-z0-9_-]{11})/,
  /embed\/([A-Za-z0-9_-]{11})/
];
var LIST_RE = /[?&]list=([A-Za-z0-9_-]{12,50})/;
var BILI_PATTERNS = [
  /bilibili\.com\/video\/(BV[A-Za-z0-9]{10})/,
  /bilibili\.com\/video\/(av\d{1,12})/i,
  /b23\.tv\/(BV[A-Za-z0-9]{10})/,
  /b23\.tv\/(av\d{1,12})\b/i
];
// Steam 商店页与社区页都认,appid 是纯数字
var STEAM_PATTERNS = [
  /store\.steampowered\.com\/app\/(\d{1,7})/,
  /steamcommunity\.com\/app\/(\d{1,7})/
];

// 手机 B站 App 分享出来的是 b23.tv/随机短码,前端跨域读不到重定向,
// 丢给 Worker 解析成 BV 号后就地替换输入框里的短链,下游全按标准链接走
var B23_SHORT_RE = /b23\.tv\/([A-Za-z0-9]{4,16})/g;
var b23Seen = {};   // code -> 1,成功失败都只解析一次

function isPlainBiliId(code) {
  return /^BV[A-Za-z0-9]{10}$/.test(code) || /^av\d{1,12}$/i.test(code);
}

function resolveB23Links() {
  var codes = [], m;
  B23_SHORT_RE.lastIndex = 0;
  while ((m = B23_SHORT_RE.exec($("links").value))) {
    if (!isPlainBiliId(m[1]) && !b23Seen[m[1]]) { b23Seen[m[1]] = 1; codes.push(m[1]); }
  }
  codes.forEach(function (c) {
    fetch("/api/b23?c=" + c).then(function (r) { return r.json(); }).then(function (d) {
      var ta = $("links");
      var re = new RegExp("(https?:\\/\\/)?b23\\.tv\\/" + c + "[^\\s]*");
      if (d.id) {
        ta.value = ta.value.replace(re, "https://www.bilibili.com/video/" + d.id);
        ta.dispatchEvent(new Event("input"));
      } else if (re.test(ta.value)) {
        var msg = $("msgThrow");
        msg.className = "msg err";
        msg.textContent = T.b23Fail;
      }
    }).catch(function () {});
  });
}
function parseIds(text) {
  var vids = [], lists = [], bilis = [], steams = [], seen = {};
  text.split(/\s+/).forEach(function (tok) {
    if (!tok) return;
    var i, m = null;
    for (i = 0; i < STEAM_PATTERNS.length; i++) {
      m = tok.match(STEAM_PATTERNS[i]);
      if (m) break;
      m = null;
    }
    if (m) {
      // seen 键加前缀,免得纯数字 appid 和别的 id 撞车
      if (!seen["s" + m[1]]) { seen["s" + m[1]] = 1; steams.push(m[1]); }
      return;
    }
    for (i = 0; i < BILI_PATTERNS.length; i++) {
      m = tok.match(BILI_PATTERNS[i]);
      if (m) break;
      m = null;
    }
    if (!m && /^BV[A-Za-z0-9]{10}$/.test(tok)) m = [tok, tok];
    if (m) {
      if (!seen[m[1]]) { seen[m[1]] = 1; bilis.push(m[1]); }
      return;
    }
    var vid = null;
    for (i = 0; i < ID_PATTERNS.length; i++) {
      m = tok.match(ID_PATTERNS[i]);
      if (m) { vid = m[1]; break; }
    }
    if (!vid && /^[A-Za-z0-9_-]{11}$/.test(tok)) vid = tok;
    if (vid) {
      if (!seen[vid]) { seen[vid] = 1; vids.push(vid); }
      return;
    }
    var lm = tok.match(LIST_RE);
    if (lm && !seen[lm[1]]) { seen[lm[1]] = 1; lists.push(lm[1]); }
  });
  return { vids: vids, lists: lists, bilis: bilis, steams: steams };
}

// B站接口整段封禁 Cloudflare 机房 IP,标题只能在扔瓶人自己的浏览器里拿
function biliJsonp(id) {
  return new Promise(function (resolve) {
    var cb = "__ybcb" + Math.random().toString(36).slice(2);
    var s = document.createElement("script");
    var done = false;
    function finish(v) {
      if (done) return;
      done = true;
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      resolve(v);
    }
    window[cb] = function (d) {
      if (d && d.code === 0 && d.data && d.data.title) {
        finish({
          id: id,
          title: String(d.data.title).slice(0, 100),
          author: String((d.data.owner && d.data.owner.name) || "").slice(0, 50),
          thumb: String(d.data.pic || "").replace(/^http:/, "https:").slice(0, 300)
        });
      } else finish(null);
    };
    s.onerror = function () { finish(null); };
    setTimeout(function () { finish(null); }, 6000);
    var param = id.indexOf("BV") === 0 ? "bvid=" + id : "aid=" + id.slice(2);
    s.src = "https://api.bilibili.com/x/web-interface/view?" + param + "&jsonp=jsonp&callback=" + cb;
    document.body.appendChild(s);
  });
}

// 贴进来的是一串裸链接,谁也认不出哪条是什么。解析出来先渲染成带标题的卡片,
// 每张能单独删掉,删完就腾出位置装别的平台
var pvTimer = null;
var pvCache = {};   // id -> {title, author, thumb}

function pvKey(item) {
  return item.bvid ? "b:" + item.bvid : item.list ? "l:" + item.list
    : item.appid ? "s:" + item.appid : "v:" + item.vid;
}

function currentItems() {
  var ids = parseIds($("links").value);
  return ids.vids.map(function (v) { return { vid: v }; })
    .concat(ids.lists.map(function (x) { return { list: x }; }))
    .concat(ids.bilis.map(function (x) { return { bvid: x }; }))
    .concat(ids.steams.map(function (x) { return { appid: x }; }));
}

function renderPreview() {
  var items = currentItems();
  var box = $("preview");
  if (!items.length) { box.className = ""; box.innerHTML = ""; return; }
  box.className = "on";
  box.innerHTML = items.map(function (it, i) {
    var c = pvCache[pvKey(it)] || {};
    var img = it.vid ? "https://i.ytimg.com/vi/" + it.vid + "/default.jpg" : thumbSmall(c.thumb, 240);
    var badge = it.bvid ? '<span class="pf-b">' + T.biliTag + "</span>"
      : it.appid ? '<span class="pf-s">Steam</span>' : it.list ? "📃 " : "";
    var title = c.title || (it.bvid || it.list || it.appid || it.vid);
    return '<div class="pv' + (c.title ? "" : " load") + '">'
      + '<img referrerpolicy="no-referrer" src="' + esc(img) + '" alt="">'
      + '<div class="t">' + badge + esc(title)
      + (c.author ? "<small>" + esc(c.author) + "</small>" : "")
      + '</div><button class="x" onclick="dropItem(' + i + ')">✕</button></div>';
  }).join("");
}

function dropItem(i) {
  var items = currentItems();
  var gone = items[i];
  if (!gone) return;
  var id = gone.vid || gone.list || gone.bvid || (gone.appid && "/app/" + gone.appid);
  // 从输入框里删掉含这个 id 的那一行,输入框始终是唯一数据源
  $("links").value = $("links").value.split(/\n/)
    .filter(function (line) { return line.indexOf(id) < 0; }).join("\n");
  $("links").dispatchEvent(new Event("input"));
}

function fetchPreviewMeta() {
  var items = currentItems();
  var needV = [], needL = [], needB = [], needS = [];
  items.forEach(function (it) {
    if (pvCache[pvKey(it)]) return;
    if (it.vid) needV.push(it.vid);
    else if (it.list) needL.push(it.list);
    else if (it.bvid) needB.push(it.bvid);
    else if (it.appid) needS.push(it.appid);
  });
  if (needV.length || needL.length || needS.length) {
    fetch("/api/preview?v=" + needV.join(",") + "&l=" + needL.join(",") + "&s=" + needS.join(","))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        (d.items || []).forEach(function (x) {
          if (x.title) pvCache[pvKey(x)] = { title: x.title, author: x.author, thumb: x.thumb };
        });
        renderPreview();
      }).catch(function () {});
  }
  needB.forEach(function (b) {
    biliJsonp(b).then(function (r) {
      if (r) { pvCache["b:" + b] = { title: r.title, author: r.author, thumb: r.thumb }; renderPreview(); }
    });
  });
}

$("links").addEventListener("input", function () {
  var ids = parseIds($("links").value);
  var n = ids.vids.length + ids.lists.length + ids.bilis.length + ids.steams.length;
  $("parsed").textContent = n;
  $("counterWrap").style.display = n ? "block" : "none";
  $("btnThrow").disabled = n === 0 || n > 10;
  try { localStorage.setItem("yb_draft", $("links").value); } catch (e) {}
  var over = $("overflow");
  if (n > 10) {
    over.textContent = T.overflow(n - 10);
    over.style.display = "block";
  } else {
    over.style.display = "none";
  }
  renderPreview();
  resolveB23Links();
  clearTimeout(pvTimer);
  pvTimer = setTimeout(fetchPreviewMeta, 600);
});

$("btnThrow").onclick = function () {
  var ids = parseIds($("links").value);
  if (!ids.vids.length && !ids.lists.length && !ids.bilis.length && !ids.steams.length) return;
  $("btnThrow").disabled = true;
  var msg = $("msgThrow");
  msg.className = "msg";
  msg.textContent = T.sealing;
  // Steam 标题服务端会自己取,预览缓存里有就一起带上当回落
  var steams = ids.steams.map(function (s) {
    var c = pvCache["s:" + s] || {};
    return { id: s, title: c.title || "", thumb: c.thumb || "" };
  });
  Promise.all(ids.bilis.map(function (b) {
    var c = pvCache["b:" + b];
    return c && c.title
      ? Promise.resolve({ id: b, title: c.title, author: c.author, thumb: c.thumb })
      : biliJsonp(b);
  })).then(function (bmetas) {
    var bilis = bmetas.filter(Boolean);
    if (!ids.vids.length && !ids.lists.length && !bilis.length && !steams.length) {
      msg.className = "msg err";
      msg.textContent = T.biliFail;
      $("btnThrow").disabled = false;
      return;
    }
    return fetch("/api/throw", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device: device, videos: ids.vids, lists: ids.lists, bilis: bilis, steams: steams })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) {
        msg.className = "msg ok";
        msg.textContent = T.thrown(d.count);
        $("links").value = ""; $("parsed").textContent = "0";
        try { localStorage.removeItem("yb_draft"); } catch (e) {}
        renderPreview();
        refreshStats();
        refreshMine();
      } else {
        msg.className = "msg err";
        msg.textContent = d.error || T.throwFail;
        $("btnThrow").disabled = false;
      }
    });
  }).catch(function () {
    msg.className = "msg err";
    msg.textContent = T.netErr;
    $("btnThrow").disabled = false;
  });
};

// 捞满 3 瓶还一瓶没扔的,软提示一次,可忽略继续捞;不做强制门槛
var myBottles = null;
var fishCount = parseInt(localStorage.getItem("yb_fishcount") || "0", 10);
var NUDGE_COOLDOWN = 7 * 24 * 3600 * 1000;

function hideNudge() { $("nudge").style.display = "none"; }

function maybeNudge() {
  fishCount++;
  localStorage.setItem("yb_fishcount", String(fishCount));
  if (fishCount < 3 || myBottles !== 0) return;
  // 2026-08-23 从「一辈子只弹一次」改成 7 天一次。第一次捞满 3 瓶时，人还没
  // 觉得「这海里该有我一份」，那一下弹早了，弹早了就等于永久燄火。
  // 老版本的 yb_nudged 存的是 "1"，parseInt 后距今远超 7 天，所以那批已经
  // 被永久燄火的人会重新收到一次 —— 这是故意的，不是兼容事故。
  // 插件那边同口径（extension/panel.js 的 NUDGE_COOLDOWN），两头别分家。
  if (Date.now() - (parseInt(localStorage.getItem("yb_nudged") || "0", 10) || 0) < NUDGE_COOLDOWN) return;
  localStorage.setItem("yb_nudged", String(Date.now()));
  var n = $("nudge");
  n.innerHTML = T.nudge
    + '<div class="row">'
    + '<button class="fol" onclick="hideNudge();switchTab(\'throw\')">' + T.nudgeGo + "</button>"
    + '<button class="fol" onclick="hideNudge()">' + T.nudgeLater + "</button>"
    + "</div>";
  n.style.display = "block";
}

// 装插件的入口。放在这里而不是首页顶上:先让人捞几瓶尝到味道,再说装东西的事。
// 三个不显示的情况,缺一个都变成打扰:已经装了(bridge.js 打的标记)、手机(插件装不了)、
// 不是 Chromium 内核(商店进不去)。关掉一次就永久不再提。
function hideExtNudge() {
  $("extNudge").style.display = "none";
  localStorage.setItem("yb_extnudged", "1");
}

function canInstallExt() {
  var ua = navigator.userAgent || "";
  if (document.documentElement.getAttribute("data-yb-ext")) return false;
  if (/Mobile|Android|iPhone|iPad|iPod/i.test(ua)) return false;
  if (/Firefox\/|FxiOS|OPR\/|SamsungBrowser/i.test(ua)) return false;
  return /Chrome\/\d/.test(ua) && !/Edg(A|iOS)\//i.test(ua);
}

// 扔瓶页的插件入口。渲染时机挂在「切到扔瓶页」上,不是页面一打开就渲染:
// 插件的 bridge.js 要等注入才打上 data-yb-ext,渲染太早会把提示塞给已经装了的人。
function renderExtThrow() {
  var n = $("extThrow");
  if (!n) return;
  if (!canInstallExt()) { n.style.display = "none"; return; }
  n.innerHTML = T.extThrowTip
    + '<a target="_blank" rel="noopener" href="' + EXT_STORE_THROW + '">'
    + T.extThrowGo + "</a>";
  n.style.display = "block";
}

function maybeExtNudge() {
  // 门槛 4 降到 2:859 个访客里 799 个只来过一天,卡在第 4 瓶等于把入口只留给会回来的人。
  // 代价是它排到了第 3 瓶那条扔瓶提示前面,两条各弹一次、各自记 localStorage,不打架
  if (fishCount < 2 || localStorage.getItem("yb_extnudged") || !canInstallExt()) return;
  var n = $("extNudge");
  if (n.style.display === "block") return;
  n.innerHTML = T.extNudge
    + '<div class="row">'
    + '<a class="fol" target="_blank" rel="noopener" id="extGo" href="'
    + EXT_STORE + '">' + T.extGo + "</a>"
    + '<button class="fol" onclick="hideExtNudge()">' + T.extNo + "</button>"
    + "</div>";
  // 点了就不再提:装没装成功这边看不到,但至少他见过了,再弹一次只会烦人
  $("extGo").onclick = hideExtNudge;
  n.style.display = "block";
}

// utm 是给商店后台的流量来源报表用的,好让「网页导过去多少人」能跟别的渠道分开算
var EXT_STORE = "https://chromewebstore.google.com/detail/ahbgoaaojaanogcampbekjmiocmnnbbk"
  + "?utm_source=bkbottle-web&utm_medium=fish";
// 扔瓶页那个入口单独记一档,好让商店后台看得出装机是从「正要扔瓶」来的
// 还是从「捞得正高兴」来的 —— 这两拨人往后留不留得住,大概率不一样
var EXT_STORE_THROW = EXT_STORE.replace("medium=fish", "medium=throw");

// isStandalone 只用于捞瓶上报里的 pwa 字段(已装用户统计),装桌面提示已整体下线
var isStandalone = false;
try {
  isStandalone = window.matchMedia("(display-mode: standalone)").matches
    || navigator.standalone === true;
} catch (e) {}

var lastBottle = null;
var lastBy = "";

// 「上一瓶」的回看历史。捞过的瓶原本划走就再也找不回来,而人常常是没看清、
// 或者犹豫了一下才想回头,所以在本地留最近 20 瓶。跟收藏是两回事:收藏得点一下
// 才存,历史是捞了就自动进;也不占 KV,服务端不需要知道谁看过什么
var hist = [];
try { hist = JSON.parse(localStorage.getItem("yb_hist") || "[]"); } catch (e) {}
var histIdx = hist.length - 1;
var liked = [];
try { liked = JSON.parse(localStorage.getItem("yb_liked") || "[]"); } catch (e) {}
function shareBottle() {
  if (!lastBottle) return;
  var lines = lastBottle.map(function (v) { return "· " + (v.title || "").slice(0, 42); });
  var hasGame = lastBottle.some(function (v) { return v.appid; });
  var hasVideo = lastBottle.some(function (v) { return !v.appid; });
  var kind = hasGame && hasVideo ? "m" : hasGame ? "g" : "v";
  var text = T.shareText(lines.join("\n"), location.origin, kind);
  function done() {
    var b = document.getElementById("shareBtn");
    if (b) b.textContent = T.shareOk;
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

// 标题下那颗域名药丸:点一下把网址复制走,好记的地址才传得出去
function copyAddr() {
  var el = $("siteAddr");
  var text = "https://b.bking.film";
  function done() {
    el.textContent = T.addrCopied;
    setTimeout(function () { el.textContent = "b.bking.film"; }, 1600);
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

function refreshFolCount() {
  $("folCount").innerHTML = follow.length
    ? T.folCount(follow.length) : "";
}

function toggleFollow(name) {
  var i = follow.indexOf(name);
  if (i < 0) follow.push(name); else follow.splice(i, 1);
  if (follow.length > 50) follow = follow.slice(-50);
  localStorage.setItem("yb_follow", JSON.stringify(follow));
  var btn = $("folBtn");
  if (btn) {
    btn.textContent = follow.indexOf(name) < 0 ? T.folAdd : T.folDone;
  }
  refreshFolCount();
}

function vote(bottleId, verdict) {
  fetch("/api/feedback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ bottle: bottleId, verdict: verdict, device: device })
  }).catch(function () {});
  // 只换掉「收藏」自己,「再捞一个」和「分享」得留着,否则点完评价就没有出口了
  var btn = $("goodBtn");
  if (btn) btn.outerHTML = '<span class="done">' + T.voteDone + "</span>";
  rememberLiked();
}

// 捞空整片海之后总得有地方可去,把他自己收藏过的瓶子留在本地当收藏夹。
// 只存前端,不占 KV,服务端也就不需要一张「谁喜欢过什么」的反查表
function rememberLiked() {
  if (!lastBottle) return;
  liked = liked.filter(function (x) { return x.by !== lastBy || x.n !== lastBottle.length; });
  liked.push({ by: lastBy || "", v: lastBottle, n: lastBottle.length });
  if (liked.length > 20) liked = liked.slice(-20);
  try { localStorage.setItem("yb_liked", JSON.stringify(liked)); } catch (e) {}
  drawMyLiked();   // 刚收的这瓶要立刻算进入口那个数字里
}

// 收藏入口:捞瓶页常驻的那一行。收藏本来只有捞空整片海才看得见,
// 等于收了也找不回来。展开给全部 20 瓶(存量上限就是 20),不再截到 5 条
var likedOpen = false;
function toggleLiked() { likedOpen = !likedOpen; drawMyLiked(); }
function drawMyLiked() {
  var el = $("myLiked");
  if (!el) return;
  if (!liked.length) { el.innerHTML = ""; return; }   // 没收藏过就不占位置
  el.innerHTML = '<button class="entry" onclick="toggleLiked()">'
    + (likedOpen ? T.likedHide : T.likedEntry(liked.length)) + "</button>"
    + (likedOpen ? '<div class="box">' + likedCards(20) + "</div>" : "");
}

// 收藏的卡片列表。倒序 —— 最近收的排最上面
function likedCards(limit) {
  var html = '<div class="vlist">';
  liked.slice().reverse().slice(0, limit).forEach(function (x) {
    (x.v || []).forEach(function (v) { html += videoCardHtml(v); });
  });
  return html + "</div>";
}

// B站 的图 CDN 认 @ 后缀缩放。原图动辄 1500px 宽,一瓶五张就是好几兆,
// 手机流量上尤其疼。通栏大封面给 800w,装瓶预览那排小图给 240w
function thumbSmall(t, w) {
  if (!t) return "";
  w = w || 480;
  return /\.(hdslb|biliimg)\.com\//.test(t)
    ? t.split("@")[0] + "@" + w + "w_" + Math.round(w * 9 / 16) + "h"
    : t;
}

function videoCardHtml(v) {
  var url, img, badge = "";
  if (v.appid) {
    // 游戏卡片:封面+名字+「TA 在玩」,点开跳 Steam 商店页。不带购买/愿望单按钮,
    // 不带促销字样 —— 卡片一旦看起来像导流位,这个产品就没人信了
    url = "https://store.steampowered.com/app/" + v.appid + "/";
    img = v.thumb || "";
    badge = '<span class="pf-s">Steam</span><span class="playing">' + T.playing + " · </span>";
  } else if (v.bvid) {
    url = "https://www.bilibili.com/video/" + v.bvid;
    img = thumbSmall(v.thumb, 800);
    badge = '<span class="pf-b">' + T.biliTag + "</span>";
  } else if (v.list) {
    url = "https://www.youtube.com/playlist?list=" + v.list;
    img = v.thumb || "";
    badge = '<span class="pf-y">YouTube</span>📃 ';
  } else {
    url = "https://www.youtube.com/watch?v=" + v.vid;
    // hqdefault 是 4:3 上下带黑边,卡片 16:9 + object-fit:cover 正好把黑边裁掉;
    // 别换 maxresdefault,老视频没有这档,会 404 成灰图
    img = "https://i.ytimg.com/vi/" + v.vid + "/hqdefault.jpg";
    badge = '<span class="pf-y">YouTube</span>';
  }
  return '<a class="vcard" href="' + url + '" target="_blank" rel="noopener">'
    + '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(img) + '" alt="">'
    + '<div class="t">' + badge + esc(v.title || T.openIt) + "</div></a>";
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

// YouTube/B站 的历史页和 Steam 都要认,id 分别塞进 hash。
// Steam 必须收紧到两条窄路(2026-08-11 BK 踩坑:在商店首页点书签,抓走的全是推荐位,
// 装进瓶子的是 Steam 算法的原样输出,不是他玩过的游戏):
// 资料页只抓「最近活动」区块(.recent_games 里的才是真实玩过的);
// 单个游戏的商店页只装当前这一个;其他 Steam 页面直接拒绝
// 三条 alert 文案跟着界面语言走,英文用户拖去的书签弹的也得是英文
function bmSrc() {
  return "(function(){var seen={},yt=[],bv=[],sa=[],h=location.hostname;"
  + "if(h==='steamcommunity.com'){"
  + "document.querySelectorAll('.recent_games a[href]').forEach(function(a){"
  + "var s=a.href.match(/\\/app\\/(\\d{1,7})/);"
  + "if(s&&!seen['s'+s[1]]){seen['s'+s[1]]=1;sa.push(s[1])}});"
  + "if(!sa.length){alert(" + JSON.stringify(T.bmNoRecent) + ");return}"
  + "}else if(h==='store.steampowered.com'){"
  + "var sm=location.pathname.match(/^\\/app\\/(\\d{1,7})/);"
  + "if(sm){sa.push(sm[1])}else{alert(" + JSON.stringify(T.bmNoApp) + ");return}"
  + "}else{"
  + "document.querySelectorAll('a[href]').forEach(function(a){"
  + "var m=a.href.match(/[?&]v=([A-Za-z0-9_-]{11})/)||a.href.match(/\\/shorts\\/([A-Za-z0-9_-]{11})/);"
  + "if(m){if(!seen[m[1]]){seen[m[1]]=1;yt.push(m[1])}return}"
  + "var b=a.href.match(/bilibili\\.com\\/video\\/(BV[A-Za-z0-9]{10})/);"
  + "if(b&&!seen[b[1]]){seen[b[1]]=1;bv.push(b[1])}});"
  + "}"
  + "yt=yt.slice(0,10);bv=bv.slice(0,10);sa=sa.slice(0,10);"
  + "if(!yt.length&&!bv.length&&!sa.length){alert(" + JSON.stringify(T.bmNoVid) + ");return}"
  + "var q=[];if(yt.length)q.push('vids='+yt.join(','));if(bv.length)q.push('bvs='+bv.join(','));if(sa.length)q.push('apps='+sa.join(','));"
  + "window.open('" + location.origin + "/#'+q.join('&'))})()";
}
// 语言切换会重建这个链接元素,所以每次都要重新挂
function bindBookmarklet() {
  var el = $("bookmarklet");
  if (!el) return;
  el.href = "javascript:" + encodeURIComponent(bmSrc());
  el.onclick = function (e) { e.preventDefault(); };
}

// 安卓装到桌面后,YouTube 的分享菜单里会出现本站,分享过来落到 /?share=...
(function restoreDraft() {
  try {
    var d = localStorage.getItem("yb_draft");
    if (d) $("links").value = d;
  } catch (e) {}
})();

(function autofillFromShare() {
  var q = new URLSearchParams(location.search);
  var shared = [q.get("share"), q.get("text"), q.get("title")].filter(Boolean).join(" ");
  if (!shared) return;
  var ids = parseIds(shared);
  // B站 App 分享出来的是 b23.tv/随机短码,parseIds 认不出,原样带进输入框由解析器接手
  var shorts = [], sm, shortSeen = {};
  B23_SHORT_RE.lastIndex = 0;
  while ((sm = B23_SHORT_RE.exec(shared))) {
    if (!isPlainBiliId(sm[1]) && !shortSeen[sm[1]]) {
      shortSeen[sm[1]] = 1;
      shorts.push("https://b23.tv/" + sm[1]);
    }
  }
  if (!ids.vids.length && !ids.lists.length && !ids.bilis.length && !ids.steams.length && !shorts.length) return;
  history.replaceState(null, "", location.pathname);
  switchTab("throw");
  var ta = $("links");
  var lines = ids.vids.map(function (v) { return "https://www.youtube.com/watch?v=" + v; })
    .concat(ids.lists.map(function (x) { return "https://www.youtube.com/playlist?list=" + x; }))
    .concat(ids.bilis.map(function (b) { return "https://www.bilibili.com/video/" + b; }))
    .concat(ids.steams.map(function (s) { return "https://store.steampowered.com/app/" + s; }))
    .concat(shorts);
  ta.value = (ta.value ? ta.value.replace(/\s*$/, "\n") : "") + lines.join("\n");
  ta.dispatchEvent(new Event("input"));
  var msg = $("msgThrow");
  msg.className = "msg ok";
  msg.textContent = T.shared;
})();

(function autofillFromHash() {
  var my = location.hash.match(/vids=([A-Za-z0-9_,-]+)/);
  var mb = location.hash.match(/bvs=([A-Za-z0-9,]+)/);
  var ms = location.hash.match(/apps=([\d,]+)/);
  if (!my && !mb && !ms) return;
  var lines = [];
  if (my) {
    my[1].split(",").filter(function (v) { return /^[A-Za-z0-9_-]{11}$/.test(v); })
      .slice(0, 10).forEach(function (v) { lines.push("https://www.youtube.com/watch?v=" + v); });
  }
  if (mb) {
    mb[1].split(",").filter(function (v) { return /^BV[A-Za-z0-9]{10}$/.test(v); })
      .slice(0, 10).forEach(function (v) { lines.push("https://www.bilibili.com/video/" + v); });
  }
  if (ms) {
    ms[1].split(",").filter(function (v) { return /^\d{1,7}$/.test(v); })
      .slice(0, 10).forEach(function (v) { lines.push("https://store.steampowered.com/app/" + v); });
  }
  if (!lines.length) return;
  lines = lines.slice(0, 10);
  history.replaceState(null, "", location.pathname);
  switchTab("throw");
  var ta = $("links");
  // 追加而不是覆盖:书签在新标签打开,之前删剩的内容靠草稿恢复回来了,不能冲掉
  ta.value = (ta.value.trim() ? ta.value.replace(/\s*$/, "\n") : "") + lines.join("\n");
  ta.dispatchEvent(new Event("input"));
  var msg = $("msgThrow");
  msg.className = "msg ok";
  msg.textContent = T.autofill(lines.length);
})();

// 演示捞不进历史 —— 它本来就不算捞瓶次数,也不该让人回看到还没开始的那一瓶
function pushHist(d) {
  hist.push({ id: d.id, by: d.by || "", followable: !!d.followable, videos: d.videos });
  if (hist.length > 20) hist = hist.slice(-20);
  histIdx = hist.length - 1;
  try { localStorage.setItem("yb_hist", JSON.stringify(hist)); } catch (e) {}
}

// 往回翻不重新请求,历史整瓶都在本地,所以也不会给这瓶多记一次「被捞」
function goHist(step) {
  var i = histIdx + step;
  if (i < 0 || i >= hist.length) return;
  histIdx = i;
  renderBottle(hist[i], false);
  var box = $("fishResult");
  if (box && box.scrollIntoView) box.scrollIntoView({ block: "nearest" });
}

function renderBottle(d, isDemo) {
  var box = $("fishResult");
  var html = "";
  if (isDemo) html += '<div class="by">' + T.demoNote + "</div>";
  if (d.by) {
    var already = follow.indexOf(d.by) >= 0;
    html += '<div class="by">' + T.fromWho + "<b>" + esc(d.by) + "</b>"
      + (already ? T.followedNote : "")
      + (d.followable
        ? '<br><button class="fol" id="folBtn" onclick="toggleFollow(\'' + esc(d.by) + '\')">'
          + (already ? T.folDone : T.folAdd) + "</button>"
        : "")
      + "</div>";
  }
  html += '<div class="vlist">';
  d.videos.forEach(function (v) { html += videoCardHtml(v); });
  html += "</div>"
    + '<div class="wm">🌊 ' + T.brand + " · " + location.host + "</div>"
    + '<div class="by">' + T.voteHint + "</div>"
    + '<div class="fb" id="fb">'
    + '<button id="goodBtn" onclick="vote(\'' + esc(d.id) + '\',\'good\')">'
    + T.voteGood + "</button>";
  // 演示捞那一瓶不给翻页入口;真捞的第一瓶背后没东西,也就不显示「上一瓶」
  if (!isDemo && histIdx > 0)
    html += '<button onclick="goHist(-1)">' + T.prevBottle + "</button>";
  if (!isDemo && histIdx < hist.length - 1)
    html += '<button onclick="goHist(1)">' + T.nextBottle + "</button>";
  html += '<button onclick="doFish(false)">' + T.fishAgain + "</button>"
    + '<button id="shareBtn" onclick="shareBottle()">' + T.shareBtn + "</button>"
    + "</div>";
  // 收藏和分享都读这两个,回看时必须跟着走,否则会把历史瓶收成当前那瓶
  lastBottle = d.videos;
  lastBy = d.by || "";
  box.innerHTML = html;
}

function doFish(isDemo) {
  var box = $("fishResult"), msg = $("msgFish");
  msg.textContent = "";
  box.innerHTML = '<div class="wave">🎣🌊</div>';
  fetch("/api/fish", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ device: device, seen: seen, follow: follow, src: mySrc,
      pwa: isStandalone, demo: isDemo === true })
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.empty) {
        if (isDemo) { box.innerHTML = ""; return; }   // 演示捞不到就装没这回事
        if (d.exhausted) {
          // 这里不再铺一份收藏 —— 下面那个常驻入口已经有了,铺两遍是同一批卡片
          box.innerHTML = '<div id="fishEmpty">' + T.exhausted + '</div>'
            + '<button class="big" onclick="switchTab(\'throw\')">' + T.goThrow + '</button>';
        } else {
          box.innerHTML = '<div id="fishEmpty">' + T.emptySea + '</div>';
        }
        return;
      }
      if (d.id && seen.indexOf(d.id) < 0) {
        seen.push(d.id);
        if (seen.length > 500) seen = seen.slice(-500);
        localStorage.setItem("yb_seen", JSON.stringify(seen));
      }
      if (!isDemo) pushHist(d);
      renderBottle(d, isDemo);
      if (!isDemo) {   // 演示不算捞瓶次数,也不触发扔瓶提示
        maybeNudge();
        maybeExtNudge();   // 必须在 maybeNudge 之后:捞瓶计数在那里面加
      }
    })
    .catch(function () {
      box.innerHTML = "";
      if (isDemo) return;
      msg.className = "msg err";
      msg.textContent = T.fishErr;
    });
}
$("btnFish").onclick = function () { doFish(false); };

applyLang();  // 所有函数就位后再渲染界面文案

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(function () {});
}

if (location.hash === "#autofish") {
  switchTab("fish");
  setTimeout(function () { $("btnFish").click(); }, 400);
}

// 插件面板里「去网页扔一瓶」落到这里:清单是空的,直接把扔瓶页摆到面前
if (location.hash === "#throw") {
  switchTab("throw");
  setTimeout(function () { var t = $("links"); if (t) t.focus(); }, 300);
}

// 装完插件浏览器自动开的这一页(见 extension/sw.js 的 onInstalled)。
// 这批人最容易装完就忘,所以把「怎么用」直接摆在最上面。顺带:bridge.js 会在
// 这一趟把网页的 device 抄给插件,不来这一趟插件就一直是「还没有身份」的状态。
// 复用 extNudge 那块位置 —— 已经装了的人不会看到劝装提示,不冲突。
(function extWelcome() {
  try {
    if (new URLSearchParams(location.search).get("from") !== "ext-install") return;
  } catch (e) { return; }
  var n = $("extNudge");
  if (!n) return;
  n.innerHTML = T.extWelcome
    + '<div class="row"><button class="fol" onclick="hideExtNudge()">'
    + T.extWelcomeOk + "</button></div>";
  n.style.display = "block";
})();

// 首访自动捞一网演示:新人 3 秒看懂这是什么。只演一次,不计任何统计;
// 带分享/书签参数进来的人有明确目的,不打断
(function demoFish() {
  if (!firstVisit || localStorage.getItem("yb_demo_done")) return;
  if (location.hash || /[?&](share|text|title)=/.test(location.search)) return;
  localStorage.setItem("yb_demo_done", "1");
  switchTab("fish");
  doFish(true);
})();
</script>
