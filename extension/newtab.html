<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新标签页</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body class="newtab">
<!-- 骨架跟 popup 完全一样,好让 panel.js 一套代码管两个入口,只有外层宽度不同 -->
<div class="sea">
  <div class="bar">
    <span class="brand">🌊 BK漂流瓶</span>
    <span class="who" id="who"></span>
  </div>

  <div class="receipt" id="receipt"></div>

  <div class="group">
    <div id="box"><div class="wave">🎣🌊</div></div>
    <div class="row" style="margin-top:11px">
      <span id="goodWrap" class="half"></span>
      <button class="primary" id="btnAgain">🎣 再捞一个</button>
    </div>
  </div>

  <div class="group" id="pgroup">
    <div class="sec fold" id="psec">
      <span>🍾 待扔的瓶子 <span class="arrow">▾</span></span>
      <span id="pcount"></span>
    </div>
    <div id="pending" class="plist cap"></div>
    <div class="row">
      <button class="ghost" id="btnThrow" style="flex:1">扔进海里</button>
    </div>
  </div>

  <div class="foot">
    <a href="https://b.bking.film/" target="_blank" rel="noopener">b.bking.film</a>
    <span>这东西不读你的浏览记录</span>
  </div>
</div>
<script src="lib.js"></script>
<script src="panel.js"></script>
</body>
</html>
