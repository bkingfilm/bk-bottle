<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BK漂流瓶</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
<div class="bar">
  <span class="brand" id="brand">🌊 BK漂流瓶</span>
  <span class="who" id="who"></span>
</div>

<div class="receipt" id="receipt"></div>

<div class="group">
  <div id="box"><div class="wave">🎣🌊</div></div>
  <div class="row" id="histNav" style="margin-top:8px;display:none">
    <span id="prevWrap" class="half"></span>
    <span id="nextWrap" class="half"></span>
  </div>
  <div class="row" style="margin-top:10px">
    <span id="goodWrap" class="half"></span>
    <button class="primary" id="btnAgain">🎣 再捞一个</button>
  </div>
</div>

<div class="nudge" id="nudge"></div>

<div class="rate" id="rate"></div>

<div class="group" id="pgroup">
  <div class="sec fold" id="psec">
    <span>🍾 待扔的瓶子 <span class="arrow">▾</span></span>
    <span id="pcount"></span>
  </div>
  <div id="pending" class="plist cap"></div>
  <div class="row">
    <button class="ghost" id="btnThrow" style="flex:1">扔进海里</button>
  </div>
  <div class="pnote" id="pnote"></div>
</div>

<div class="group" id="lgroup">
  <div class="sec fold" id="lsec">
    <span id="lsecTitle">⭐ 我的收藏 <span class="arrow">▾</span></span>
    <span id="lcount"></span>
  </div>
  <div id="likedBox" class="vlist cap hide"></div>
</div>

<div class="foot">
  <span id="footPrivacy">不读你的浏览记录</span><span> · </span><a href="https://github.com/bkingfilm/bk-bottle" target="_blank" rel="noopener"><span id="footStar">来 GitHub 点个</span><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-label="Star" style="vertical-align:-2px;margin-left:2px"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694Z"/></svg></a></span>
  <span id="ver"></span>
</div>

<script src="lib.js"></script>
<script src="panel.js"></script>
</body>
</html>
