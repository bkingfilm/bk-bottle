<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BK漂流瓶</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d2c46">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root {
  --deep: #071a2b;
  --mid: #0d2c46;
  --card: #10344f;
  --line: #1e4a6d;
  --ink: #e8f2fa;
  --dim: #8fb3cc;
  --glow: #4dd0e1;
  --amber: #ffcf6e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: linear-gradient(180deg, #04101d 0%, var(--deep) 40%, #0a2438 100%);
  color: var(--ink);
  min-height: 100vh;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; position: relative; }
#langSwitch { position: absolute; top: 14px; right: 20px; z-index: 5; }
#langBtn {
  padding: 5px 12px; font-size: 13px; cursor: pointer;
  background: rgba(16, 52, 79, .8); color: var(--dim);
  border: 1px solid var(--line); border-radius: 8px;
}
#langBtn:hover { color: var(--ink); border-color: var(--glow); }
#langMenu {
  display: none; position: absolute; top: 32px; right: 0; min-width: 108px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
}
#langMenu.open { display: block; }
#langMenu button {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 9px 14px; font-size: 13px; white-space: nowrap;
  background: none; color: var(--dim); border: none;
}
#langMenu button:hover { background: var(--mid); color: var(--ink); }
#langMenu button.on { color: var(--glow); }
header { text-align: center; margin-bottom: 34px; }
header .logo { font-size: 52px; }
header h1 { font-size: 26px; letter-spacing: 2px; margin-top: 8px; }
header p { color: var(--dim); margin-top: 8px; font-size: 14px; line-height: 1.7; }
#stats { color: var(--glow); }

.tabs { display: flex; gap: 12px; margin-bottom: 22px; }
.tabs button {
  flex: 1; padding: 14px 0; font-size: 16px; cursor: pointer;
  background: var(--mid); color: var(--dim);
  border: 1px solid var(--line); border-radius: 12px;
  transition: all .15s;
}
.tabs button.on { background: var(--card); color: var(--ink); border-color: var(--glow); }

.panel { display: none; background: var(--mid); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
.panel.on { display: block; }
.panel h2 { font-size: 17px; margin-bottom: 6px; }
.panel .hint { color: var(--dim); font-size: 13px; line-height: 1.8; margin-bottom: 14px; }

textarea, input[type=text] {
  width: 100%; background: var(--deep); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 12px; font-size: 14px; font-family: inherit;
}
textarea { height: 150px; resize: vertical; line-height: 1.8; }
textarea:focus, input:focus { outline: none; border-color: var(--glow); }
input[type=text] { margin-top: 12px; }
.counter { margin-top: 10px; font-size: 13px; color: var(--dim); }
.counter b { color: var(--amber); }

.big {
  width: 100%; margin-top: 16px; padding: 15px 0;
  font-size: 16px; font-weight: bold; cursor: pointer;
  background: linear-gradient(135deg, #1687a7, #4dd0e1);
  color: #04202e; border: none; border-radius: 12px;
}
.big:disabled { opacity: .45; cursor: default; }
.msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
.msg.ok { color: var(--glow); }
.msg.err { color: #ff9a8a; }

.by {
  color: var(--amber); font-size: 13px; margin-bottom: 12px; text-align: center;
  background: rgba(255, 207, 110, .07); border: 1px dashed rgba(255, 207, 110, .35);
  border-radius: 10px; padding: 8px 12px; line-height: 1.6;
}
.fol {
  margin-top: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  background: var(--card); color: var(--amber);
  border: 1px solid rgba(255, 207, 110, .5); border-radius: 8px;
}
.fol:hover { border-color: var(--amber); }
#folCount { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
#folCount b { color: var(--amber); }
.me { color: var(--dim); font-size: 12px; text-align: center; margin-top: 12px; line-height: 1.7; }
.me b { color: var(--amber); }
#nudge {
  display: none; margin-top: 14px; padding: 13px 16px; text-align: center;
  background: linear-gradient(135deg, rgba(255, 207, 110, .13), rgba(77, 208, 225, .09));
  border: 1px solid rgba(255, 207, 110, .5); border-radius: 12px;
  color: var(--amber); font-size: 14px; line-height: 1.8;
}
#nudge .row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
#cheer {
  display: none; margin-bottom: 18px; padding: 13px 16px; text-align: center;
  background: linear-gradient(135deg, rgba(255, 207, 110, .15), rgba(77, 208, 225, .1));
  border: 1px solid rgba(255, 207, 110, .55); border-radius: 12px;
  color: var(--amber); font-size: 14px; line-height: 1.8;
}
.wm { text-align: center; color: var(--dim); font-size: 12px; margin-top: 14px; letter-spacing: .5px; }
.fb { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.fb button {
  padding: 9px 20px; font-size: 14px; cursor: pointer;
  background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
}
.fb button:hover { border-color: var(--glow); }
.fb .done { color: var(--dim); font-size: 13px; padding: 9px 0; }
.vlist { display: flex; flex-direction: column; gap: 12px; }
.vcard {
  display: flex; gap: 14px; align-items: center; text-decoration: none;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px; color: var(--ink);
  transition: border-color .15s;
}
.vcard:hover { border-color: var(--glow); }
.vcard img { width: 128px; height: 72px; object-fit: cover; border-radius: 8px; background: #000; flex-shrink: 0; }
.vcard .t { font-size: 14px; line-height: 1.6; }
.pf-b {
  font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-right: 6px;
  background: #133040; color: #6fd5f0; vertical-align: 2px;
}
.vcard .u { font-size: 12px; color: var(--dim); margin-top: 4px; }
#fishEmpty { text-align: center; color: var(--dim); padding: 30px 0; line-height: 2; }
footer { text-align: center; margin-top: 30px; font-size: 13px; color: var(--dim); line-height: 1.8; }
footer a { color: var(--glow); text-decoration: none; }
footer a:hover { text-decoration: underline; }
.wave { text-align: center; font-size: 40px; padding: 20px 0; }

details.grab {
  background: rgba(77, 208, 225, .06); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px;
}
details.grab summary { cursor: pointer; color: var(--glow); }
details.grab ol { margin: 10px 0 4px 20px; color: var(--dim); line-height: 2; }
.bm {
  display: inline-block; padding: 6px 14px; border-radius: 8px;
  background: var(--card); border: 1px solid var(--glow);
  color: var(--glow); text-decoration: none; font-weight: bold; cursor: grab;
}
</style>
</head>

// 与服务端同一套算法,同一设备永远得到同一个代号
var SEA_WORDS = [
  "灯塔", "浮标", "罗盘", "鲸落", "暗流", "礁石", "贝壳", "海星", "水母", "珊瑚",
  "潮汐", "海雾", "桅杆", "渔火", "涛声", "海沟", "洋流", "信天翁", "海豚", "旗鱼",
  "玳瑁", "沉锚", "海图", "月光", "汽笛", "北斗", "远帆", "夜航", "冰山", "季风"
];
function nickname(dev) {
  var h = 5381;
  for (var i = 0; i < dev.length; i++) h = ((h * 33) ^ dev.charCodeAt(i)) >>> 0;
  // 位数必须和服务端一致,否则自己看到的代号和别人看到的对不上
  return SEA_WORDS[h % SEA_WORDS.length] + " " + ((h >>> 5) % 900 + 100);
}

// 回执:自己的瓶子被捞到、被点「有意思」,回来就能看见
function refreshMine() {
  fetch("/api/mine?device=" + encodeURIComponent(device))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      myBottles = d.bottles || 0;
      var name = "<b>" + nickname(device) + "</b>";

      }
      var t = T.myNameHas(name, d.bottles);
      if (d.good) t += T.goodGot(d.good);
      else if (d.fished) t += T.fishedOnly;
      else t += T.drifting;
      $("myName").innerHTML = t;

      var last = localStorage.getItem("yb_lastgood");
      if (last !== null && d.good > parseInt(last, 10)) {
        var c = $("cheer");
        c.innerHTML = T.cheer(d.good - parseInt(last, 10));
        c.style.display = "block";
      }
      localStorage.setItem("yb_lastgood", String(d.good || 0));
    })
    .catch(function () {});
}

var ID_PATTERNS = [
  /[?&]v=([A-Za-z0-9_-]{11})/,
  /youtu\.be\/([A-Za-z0-9_-]{11})/,
  /shorts\/([A-Za-z0-9_-]{11})/,
  /embed\/([A-Za-z0-9_-]{11})/
];
var LIST_RE = /[?&]list=([A-Za-z0-9_-]{12,50})/;
var BILI_PATTERNS = [
  /bilibili\.com\/video\/(BV[A-Za-z0-9]{10})/,
  /bilibili\.com\/video\/(av\d{1,12})/i,
  /b23\.tv\/(BV[A-Za-z0-9]{10})/
];
function parseIds(text) {
  var vids = [], lists = [], bilis = [], seen = {};
  text.split(/\s+/).forEach(function (tok) {
    if (!tok) return;
    var i, m = null;
    for (i = 0; i < BILI_PATTERNS.length; i++) {
      m = tok.match(BILI_PATTERNS[i]);
      if (m) break;
      m = null;
    }
    if (!m && /^BV[A-Za-z0-9]{10}$/.test(tok)) m = [tok, tok];
    if (m) {
      if (!seen[m[1]]) { seen[m[1]] = 1; bilis.push(m[1]); }
      return;
    }
    var vid = null;
    for (i = 0; i < ID_PATTERNS.length; i++) {
      m = tok.match(ID_PATTERNS[i]);
      if (m) { vid = m[1]; break; }
    }
    if (!vid && /^[A-Za-z0-9_-]{11}$/.test(tok)) vid = tok;
    if (vid) {
      if (!seen[vid]) { seen[vid] = 1; vids.push(vid); }
      return;
    }
    var lm = tok.match(LIST_RE);
    if (lm && !seen[lm[1]]) { seen[lm[1]] = 1; lists.push(lm[1]); }
  });
  return { vids: vids.slice(0, 10), lists: lists.slice(0, 10), bilis: bilis.slice(0, 10) };
}

// B站接口整段封禁 Cloudflare 机房 IP,标题只能在扔瓶人自己的浏览器里拿
function biliJsonp(id) {
  return new Promise(function (resolve) {
    var cb = "__ybcb" + Math.random().toString(36).slice(2);
    var s = document.createElement("script");
    var done = false;
    function finish(v) {
      if (done) return;
      done = true;
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      resolve(v);
    }
    window[cb] = function (d) {
      if (d && d.code === 0 && d.data && d.data.title) {
        finish({
          id: id,
          title: String(d.data.title).slice(0, 100),
          author: String((d.data.owner && d.data.owner.name) || "").slice(0, 50),
          thumb: String(d.data.pic || "").replace(/^http:/, "https:").slice(0, 300)
        });
      } else finish(null);
    };
    s.onerror = function () { finish(null); };
    setTimeout(function () { finish(null); }, 6000);
    var param = id.indexOf("BV") === 0 ? "bvid=" + id : "aid=" + id.slice(2);
    s.src = "https://api.bilibili.com/x/web-interface/view?" + param + "&jsonp=jsonp&callback=" + cb;
    document.body.appendChild(s);
  });
}

$("links").addEventListener("input", function () {
  var ids = parseIds($("links").value);
  var n = ids.vids.length + ids.lists.length + ids.bilis.length;
  $("parsed").textContent = n;
  $("btnThrow").disabled = n === 0;
});

$("btnThrow").onclick = function () {
  var ids = parseIds($("links").value);
  if (!ids.vids.length && !ids.lists.length && !ids.bilis.length) return;
  $("btnThrow").disabled = true;
  var msg = $("msgThrow");
  msg.className = "msg";
  msg.textContent = T.sealing;
  Promise.all(ids.bilis.map(biliJsonp)).then(function (bmetas) {
    var bilis = bmetas.filter(Boolean);
    if (!ids.vids.length && !ids.lists.length && !bilis.length) {
      msg.className = "msg err";
      msg.textContent = T.biliFail;
      $("btnThrow").disabled = false;
      return;
    }
    return fetch("/api/throw", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device: device, videos: ids.vids, lists: ids.lists, bilis: bilis })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) {
        msg.className = "msg ok";
        msg.textContent = T.thrown(d.count);
        $("links").value = ""; $("parsed").textContent = "0";
        refreshStats();
        refreshMine();
      } else {
        msg.className = "msg err";
        msg.textContent = d.error || T.throwFail;
        $("btnThrow").disabled = false;
      }
    });
  }).catch(function () {
    msg.className = "msg err";
    msg.textContent = T.netErr;
    $("btnThrow").disabled = false;
  });
};

// 捞满 3 瓶还一瓶没扔的,软提示一次,可忽略继续捞;不做强制门槛
var myBottles = null;
var fishCount = parseInt(localStorage.getItem("yb_fishcount") || "0", 10);

function hideNudge() { $("nudge").style.display = "none"; }

function maybeNudge() {
  fishCount++;
  localStorage.setItem("yb_fishcount", String(fishCount));
  if (fishCount < 3 || myBottles !== 0 || localStorage.getItem("yb_nudged")) return;
  localStorage.setItem("yb_nudged", "1");
  var n = $("nudge");
  n.innerHTML = T.nudge
    + '<div class="row">'
    + '<button class="fol" onclick="hideNudge();switchTab(\'throw\')">' + T.nudgeGo + "</button>"
    + '<button class="fol" onclick="hideNudge()">' + T.nudgeLater + "</button>"
    + "</div>";
  n.style.display = "block";
}

var lastBottle = null;
function shareBottle() {
  if (!lastBottle) return;
  var lines = lastBottle.map(function (v) { return "· " + (v.title || "").slice(0, 42); });
  var text = T.shareText(lines.join("\n"), location.origin);
  function done() {
    var b = document.getElementById("shareBtn");
    if (b) b.textContent = T.shareOk;
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

function refreshFolCount() {
  $("folCount").innerHTML = follow.length
    ? T.folCount(follow.length) : "";
}

function toggleFollow(name) {
  var i = follow.indexOf(name);
  if (i < 0) follow.push(name); else follow.splice(i, 1);
  if (follow.length > 50) follow = follow.slice(-50);
  localStorage.setItem("yb_follow", JSON.stringify(follow));
  var btn = $("folBtn");
  if (btn) {
    btn.textContent = follow.indexOf(name) < 0 ? T.folAdd : T.folDone;
  }
  refreshFolCount();
}

function vote(bottleId, verdict) {
  fetch("/api/feedback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ bottle: bottleId, verdict: verdict, device: device })
  }).catch(function () {});
  var fb = document.getElementById("fb");
  if (fb) fb.innerHTML = '<span class="done">' + T.voteDone + '</span>';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

var BM_SRC = "(function(){var seen={},ids=[];"
  + "document.querySelectorAll('a[href]').forEach(function(a){"
  + "var m=a.href.match(/[?&]v=([A-Za-z0-9_-]{11})/)||a.href.match(/\\/shorts\\/([A-Za-z0-9_-]{11})/);"
  + "if(m&&!seen[m[1]]){seen[m[1]]=1;ids.push(m[1])}});"
  + "ids=ids.slice(0,10);"
  + "if(!ids.length){alert('这一页没找到视频，先打开 youtube.com/feed/history 再点');return}"
  + "window.open('" + location.origin + "/#vids='+ids.join(','))})()";
// 语言切换会重建这个链接元素,所以每次都要重新挂
function bindBookmarklet() {
  var el = $("bookmarklet");
  if (!el) return;
  el.href = "javascript:" + encodeURIComponent(BM_SRC);
  el.onclick = function (e) { e.preventDefault(); };
}

// 安卓装到桌面后,YouTube 的分享菜单里会出现本站,分享过来落到 /?share=...
(function autofillFromShare() {
  var q = new URLSearchParams(location.search);
  var shared = [q.get("share"), q.get("text"), q.get("title")].filter(Boolean).join(" ");
  if (!shared) return;
  var ids = parseIds(shared);
  if (!ids.vids.length && !ids.lists.length) return;
  history.replaceState(null, "", location.pathname);
  switchTab("throw");
  var ta = $("links");
  var lines = ids.vids.map(function (v) { return "https://www.youtube.com/watch?v=" + v; })
    .concat(ids.lists.map(function (x) { return "https://www.youtube.com/playlist?list=" + x; }));
  ta.value = (ta.value ? ta.value.replace(/\s*$/, "\n") : "") + lines.join("\n");
  ta.dispatchEvent(new Event("input"));
  var msg = $("msgThrow");
  msg.className = "msg ok";
  msg.textContent = T.shared;
})();

(function autofillFromHash() {
  var m = location.hash.match(/vids=([A-Za-z0-9_,-]+)/);
  if (!m) return;
  var ids = m[1].split(",").filter(function (v) {
    return /^[A-Za-z0-9_-]{11}$/.test(v);
  }).slice(0, 10);
  if (!ids.length) return;
  history.replaceState(null, "", location.pathname);
  switchTab("throw");
  var ta = $("links");
  ta.value = ids.map(function (v) { return "https://www.youtube.com/watch?v=" + v; }).join("\n");
  ta.dispatchEvent(new Event("input"));
  var msg = $("msgThrow");
  msg.className = "msg ok";
  msg.textContent = T.autofill(ids.length);
})();

$("btnFish").onclick = function () {
  var box = $("fishResult"), msg = $("msgFish");
  msg.textContent = "";
  box.innerHTML = '<div class="wave">🎣🌊</div>';
  fetch("/api/fish", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ device: device, seen: seen, follow: follow })
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.empty) {
        if (d.exhausted) {
          box.innerHTML = '<div id="fishEmpty">' + T.exhausted + '</div>'
            + '<button class="big" onclick="switchTab(\'throw\')">' + T.goThrow + '</button>';
        } else {
          box.innerHTML = '<div id="fishEmpty">' + T.emptySea + '</div>';
        }
        return;
      }
      if (d.id && seen.indexOf(d.id) < 0) {
        seen.push(d.id);
        if (seen.length > 500) seen = seen.slice(-500);
        localStorage.setItem("yb_seen", JSON.stringify(seen));
      }
      var html = "";
      if (d.by) {
        var already = follow.indexOf(d.by) >= 0;
        html += '<div class="by">' + T.fromWho + "<b>" + esc(d.by) + "</b>"
          + (already ? T.followedNote : "")
          + (d.followable
            ? '<br><button class="fol" id="folBtn" onclick="toggleFollow(\'' + esc(d.by) + '\')">'
              + (already ? T.folDone : T.folAdd) + "</button>"
            : "")
          + "</div>";
      }
      html += '<div class="vlist">';
      d.videos.forEach(function (v) {
        var url, img, badge = "";
        if (v.bvid) {
          url = "https://www.bilibili.com/video/" + v.bvid;
          img = v.thumb || "";
          badge = '<span class="pf-b">B站</span>';
        } else if (v.list) {
          url = "https://www.youtube.com/playlist?list=" + v.list;
          img = v.thumb || "";
          badge = "📃 ";
        } else {
          url = "https://www.youtube.com/watch?v=" + v.vid;
          img = "https://i.ytimg.com/vi/" + v.vid + "/mqdefault.jpg";
        }
        html += '<a class="vcard" href="' + url + '" target="_blank" rel="noopener">'
          + '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(img) + '" alt="">'
          + '<div><div class="t">' + badge + esc(v.title || T.openIt) + "</div>"
          + '<div class="u">' + url + "</div></div></a>";
      });
      html += "</div>"
        + '<div class="wm">🌊 BK漂流瓶 · ' + location.host + "</div>"
        + '<div class="fb" id="fb">'
        + '<button onclick="vote(\'' + esc(d.id) + '\',\'good\')">' + T.voteGood + "</button>"
        + '<button onclick="vote(\'' + esc(d.id) + '\',\'bad\')">' + T.voteBad + "</button>"
        + '<button id="shareBtn" onclick="shareBottle()">' + T.shareBtn + "</button>"
        + "</div>";
      lastBottle = d.videos;
      box.innerHTML = html;
      maybeNudge();
    })
    .catch(function () {
      box.innerHTML = "";
      msg.className = "msg err";
      msg.textContent = T.fishErr;
    });
};
