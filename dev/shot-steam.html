<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>商店截图·Steam 版 1280x800</title>
<link rel="stylesheet" href="../extension/base.css">
<link rel="stylesheet" href="../extension/popup.css">
<style>
  /* Steam 功能宣传图:1280x800,商店截图同规格,也可直接发社交平台。
     用 headless 截图生成:
     chrome --headless=new --screenshot=shot-steam.png --window-size=1280,800 file:///.../dev/shot-steam.html
     版式与 shot.html 一致,只换文案与瓶内容。不进发布包(在 dev/ 下)。 */
  html, body { margin: 0; padding: 0; }
  html {
    width: 1280px; height: 800px; overflow: hidden;
    background: radial-gradient(ellipse at 22% 12%, #0d2c46, #04101d 72%);
    display: flex; align-items: center; justify-content: center; gap: 56px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .pitch { width: 540px; color: #e8f2fa; }
  .pitch h1 { font-size: 46px; line-height: 1.3; margin: 0 0 20px; letter-spacing: .5px; }
  .pitch h1 b { color: #4dd0e1; }
  .pitch p { font-size: 21px; line-height: 1.85; color: #8fb3cc; margin: 0 0 16px; }
  .pitch ul { margin: 24px 0 0; padding: 0; list-style: none; }
  .pitch li {
    font-size: 19.5px; color: #c9dceb; padding: 9px 0 9px 32px; position: relative;
  }
  .pitch li::before {
    content: "✓"; position: absolute; left: 0; color: #4dd0e1; font-weight: 700;
  }
  .addr {
    display: inline-block; margin-top: 26px; padding: 8px 20px;
    font-family: ui-monospace, Consolas, monospace; font-size: 19px; letter-spacing: 1px;
    color: #4dd0e1; background: #0d2c46; border: 1px solid #1e4a6d; border-radius: 999px;
  }
  body.popup {
    max-height: none; overflow: visible;
    zoom: 1.15;
    border: 1px solid #1e4a6d; border-radius: 14px;
    box-shadow: 0 26px 70px rgba(0, 0, 0, .55);
  }
  body.popup .vlist.cap { max-height: 322px; }
</style>
</head>
<body class="popup">
<div class="bar">
  <span class="brand">🌊 BK漂流瓶</span>
  <span class="who" id="who"></span>
</div>
<div class="receipt" id="receipt"></div>
<div class="group">
  <div id="box"><div class="wave">🎣🌊</div></div>
  <div class="row" style="margin-top:10px">
    <span id="goodWrap" class="half"></span>
    <button class="primary" id="btnAgain">🎣 再捞一个</button>
  </div>
</div>
<div class="group" id="pgroup">
  <div class="sec fold" id="psec">
    <span>🍾 待扔的瓶子 <span class="arrow">▾</span></span>
    <span id="pcount"></span>
  </div>
  <div id="pending" class="plist cap"></div>
  <div class="row">
    <button class="ghost" id="btnThrow" style="flex:1">扔进海里</button>
  </div>
  <div class="pnote" id="pnote"></div>
</div>
<div class="foot">
  <span>不读你的浏览记录 · <a href="https://github.com/bkingfilm/bk-bottle">源码</a></span>
  <span id="ver">v0.1.8</span>
</div>

<script>
// 左边那段文案得插到 html 里、排在 body 前面,所以用脚本塞
var pitch = document.createElement("div");
pitch.className = "pitch";
pitch.innerHTML =
  "<h1>现在也能扔<br><b>Steam 里的游戏</b>了</h1>"
  + "<p>不光是视频。把你真的在玩的游戏装进瓶子，<br>捞一瓶陌生人的试试。</p>"
  + "<ul><li>Steam 商店页一键「装进瓶子」</li>"
  + "<li>自己的资料页一键装入「最近在玩」</li>"
  + "<li>游戏和视频可以混着装一瓶</li>"
  + "<li>不读浏览记录，不用注册</li></ul>"
  + '<span class="addr">b.bking.film</span>';
document.documentElement.insertBefore(pitch, document.body);

// 假数据:截图要的是版式,不去打真实接口。封面用 Steam 官方 header,
// 第一张全露(影之刃零,08-12 BK 指定),第二张只露上沿示意一瓶不止一条
var FAKE = {
  id: "b:shot", by: "灯塔 657",
  videos: [
    { appid: "4115450", title: "影之刃零",
      thumb: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/4115450/40b2044606b59e0cdd9fb89738895fea8a22067c/header_schinese.jpg?t=1786515952" },
    { appid: "206440", title: "To the Moon《去月球》",
      thumb: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/206440/header.jpg?t=1780927584" },
    { bvid: "BV1MBKN65E5G",
      title: "为什么我要万里迢迢，记录黄河边的村庄？",
      thumb: "https://i2.hdslb.com/bfs/archive/02da0497ba0dfb06dd0e57d3dd99cf9ade3099a9.jpg" },
  ],
};
window.chrome = {
  storage: { local: { get: function (k, cb) { cb({ device: "shot", lastGood: 0 }); },
                      set: function (o, cb) { if (cb) cb(); } },
             onChanged: { addListener: function () {} } },
  action: { setBadgeText: function () {}, setBadgeBackgroundColor: function () {} },
  tabs: { create: function () {} },
  runtime: { onInstalled: { addListener: function () {} }, onStartup: { addListener: function () {} },
             getManifest: function () { return { version: "0.1.8" }; } },
  i18n: { getMessage: function (k, a) {
    var zh = {
      brand: "🌊 BK漂流瓶", btnAgain: "🎣 再捞一个", btnGood: "🌟 收藏",
      goodDone: "🌟 已收藏", pendingTitle: "🍾 待扔的瓶子",
      pendingEmpty: "在 YouTube、B站 或 Steam 点「装进瓶子」可以攒着一起扔",
      btnThrow: "扔进海里", btnThrowEmpty: "🍾 去网页扔一瓶",
      fromWho: "🧭 这瓶来自", followedMark: " · 你记住过的瓶主",
      likedTitle: "你收藏的这几瓶：", openIt: "打开看看是什么",
      notBound: "未连接身份", whoIs: "你是", whoMasked: "你是 <b>★★★</b>",
      whoShow: "点一下看你的代号", whoHide: "点一下隐藏代号",
      footNoHistory: "不读你的浏览记录", footStar: "来 GitHub 点个", removeTip: "拿出来",
      rateAsk: "用着还行的话，去商店写一句", rateGo: "去评分", rateLater: "以后再说",
    };
    return zh[k] || "";
  } },
};
window.fetch = function (url) {
  if (url.indexOf("/api/fish") >= 0)
    return Promise.resolve({ json: function () { return Promise.resolve(FAKE); } });
  if (url.indexOf("/api/mine") >= 0)
    return Promise.resolve({ json: function () {
      return Promise.resolve({ good: 0, name: "北斗 796" }); } });
  return Promise.resolve({ json: function () { return Promise.resolve({ ok: true }); } });
};
</script>
<script src="../extension/lib.js"></script>
<script src="../extension/panel.js"></script>
<script>
// 截图里用的是假代号,展开显示才说得清「你也有个代号」,不泄露真实信息
(function showWho() {
  var w = document.getElementById("who");
  if (w && w.onclick) { w.onclick(); return; }
  setTimeout(showWho, 80);
})();
</script>
</body>
</html>
